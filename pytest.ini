[pytest]
# Python test suite (the Jest unit tests live in __tests__/ and run with `npm test`).
#   pytest tests/tooling                                   # no running app needed
#   pytest tests/api --base-url http://localhost:3000      # needs a running Soombook
testpaths = tests
addopts = -ra --import-mode=importlib
markers =
    api: contract tests that call a running Soombook site
